name: FollowUp
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.sunway.followup
    TARGETED_DEVICE_FAMILY: '1'
targets:
  FollowUp:
    type: application
    platform: iOS
    sources: [FollowUp]
    info:
      path: FollowUp/Info.plist
      properties:
        CFBundleDisplayName: 回访小助手
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  FollowUpTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FollowUpTests]
    dependencies:
      - target: FollowUp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FollowUp:
    build:
      targets:
        FollowUp: all
    test:
      targets: [FollowUpTests]
